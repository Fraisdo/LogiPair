[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logipair"
version = "1.0.0"
description = "Reliable Windows-only Easy-Switch pairing for MX Keys and MX Anywhere 3S"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
]

[project.scripts]
logipair = "logipair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["logipair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short --cov=logipair --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
omit = [
    "src/logipair/__main__.py",
    "src/logipair/hidapi_backend.py",
    "src/logipair/lifecycle.py",
    "src/logipair/instance.py",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
